# Build the Qt (PySide6) desktop app for macOS, Windows, and Linux.
#
# - workflow_dispatch: build all platforms; optionally publish to GitHub Releases
# - push tags desktop-v*: build + publish (version taken from the tag)
#
# Publishing uploads artifacts + latest-qt-*.json to the GitHub Release v<version>
# (created if missing), which the app's updater reads. Without a tag, <version> is
# the one in desktop/package.json.

name: Desktop build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload artifacts to GitHub Release v<desktop/package.json version>"
        type: boolean
        default: false
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure GitHub release exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == desktop-v* ]]; then
            VERSION="${GITHUB_REF_NAME#desktop-v}"
            PUBLISH=true
          else
            VERSION="$(python -c 'import json, pathlib; print(json.loads(pathlib.Path("desktop/package.json").read_text())["version"])')"
            PUBLISH="${{ inputs.publish }}"
          fi
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          if [[ "${PUBLISH}" != "true" ]]; then
            exit 0
          fi
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
              --title "${VERSION}" --notes ""
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
          - os: windows-latest
          # Oldest supported runner: the AppImage needs a glibc at least as new as the build host's.
          - os: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            desktop/requirements.txt

      - name: Sync desktop version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#desktop-v}"
          echo "Setting desktop version to ${VER} from tag"
          (cd desktop && npm version "$VER" --no-git-tag-version --allow-same-version)

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxkbfile1 libasound2 libfontconfig1 libdbus-1-3

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # uvloop is Unix-only; drop the bare lockfile pin so Windows doesn't try to build it.
          # On Linux/macOS, uvicorn[standard] still pulls uvloop via its own platform markers.
          grep -v '^uvloop==' backend/requirements.txt > "${RUNNER_TEMP}/requirements-desktop.txt"
          python -m pip install -r "${RUNNER_TEMP}/requirements-desktop.txt"
          python -m pip install -r desktop/requirements.txt

      - name: Build frontend → backend/static
        shell: bash
        run: bash desktop/scripts/build-frontend.sh

      - name: Build and package desktop app
        shell: bash
        env:
          DATAFETA_PYTHON: python
          SKIP_FRONTEND: "1"
        run: bash desktop/scripts/build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: desktop/dist/*

      - name: Publish to GitHub Release
        if: ${{ needs.prepare-release.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ needs.prepare-release.outputs.tag }}" desktop/dist/* --clobber --repo "${GITHUB_REPOSITORY}"
