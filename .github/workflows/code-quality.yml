name: Code Quality

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  backend-dependency-sync:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install pip-tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-tools

    - name: Verify compiled backend requirements are up to date
      run: |
        cd backend
        pip-compile --output-file=requirements.txt requirements.in
        python - <<'PY'
        import re
        from pathlib import Path

        path = Path("requirements.txt")
        text = path.read_text()
        note = "# Unix-only (uvicorn[standard] marks this); bare pin without marker breaks Windows CI/desktop builds.\n"
        pattern = re.compile(
            r'(?m)(?:^# Unix-only.*\n)?^uvloop==([^\s;]+)(?:\s*;\s*sys_platform\s*!=\s*"win32")?\n([ \t]*# via uvicorn\n)'
        )

        def repl(match: re.Match[str]) -> str:
            version = match.group(1)
            via_line = match.group(2)
            return f'{note}uvloop=={version} ; sys_platform != "win32"\n{via_line}'

        normalized_text, _ = pattern.subn(repl, text, count=1)
        path.write_text(normalized_text)
        PY
        git diff --exit-code requirements.txt

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black isort mypy

    - name: Run Black code formatter check
      run: |
        cd backend
        black --check . || true

    - name: Run isort import check
      run: |
        cd backend
        isort --check-only . || true

    - name: Run Flake8 linting
      run: |
        cd backend
        flake8 . --max-line-length=100 --extend-ignore=E203,W503 || true
