name: Code Quality

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  backend-dependency-sync:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install pip-tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-tools

    - name: Verify compiled backend requirements are up to date
      run: |
        cd backend
        pip-compile --output-file=requirements.txt requirements.in
        python - <<'PY'
        from pathlib import Path

        path = Path("requirements.txt")
        lines = path.read_text().splitlines(keepends=True)
        note = "# Unix-only (uvicorn[standard] marks this); bare pin without marker breaks Windows CI/desktop builds.\n"

        for idx, line in enumerate(lines):
            if line.startswith("uvloop=="):
                version = line.split("==", 1)[1].split(";", 1)[0].strip()
                if idx > 0 and lines[idx - 1].startswith("# Unix-only (uvicorn[standard] marks this);"):
                    lines.pop(idx - 1)
                    idx -= 1
                lines[idx] = f"uvloop=={version} ; sys_platform != \"win32\"\n"
                lines.insert(idx, note)
                break

        path.write_text("".join(lines))
        PY
        git diff --exit-code requirements.txt

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black isort mypy

    - name: Run Black code formatter check
      run: |
        cd backend
        black --check . || true

    - name: Run isort import check
      run: |
        cd backend
        isort --check-only . || true

    - name: Run Flake8 linting
      run: |
        cd backend
        flake8 . --max-line-length=100 --extend-ignore=E203,W503 || true
