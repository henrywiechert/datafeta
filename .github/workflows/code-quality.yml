name: Code Quality

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  backend-dependency-sync:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install pip-tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-tools

    - name: Verify compiled backend requirements are up to date
      run: |
        cd backend
        pip-compile --output-file=requirements.txt requirements.in
        python - <<'PY'
        from pathlib import Path

        path = Path("requirements.txt")
        lines = path.read_text().splitlines(keepends=True)
        note_prefix = "# Unix-only (uvicorn[standard] marks this);"
        full_note = f"{note_prefix} bare pin without marker breaks Windows CI/desktop builds.\n"
        note = next(
            (
                line
                for line in lines
                if line.startswith(note_prefix)
            ),
            full_note,
        )
        sub_count = 0

        for idx, line in enumerate(lines):
            if line.startswith("uvloop=="):
                if "==" not in line:
                    raise SystemExit(f"Unexpected uvloop requirement format: {line.strip()}")

                version = line.split("==", 1)[1].split(";", 1)[0].strip()
                start = idx - 1 if idx > 0 and lines[idx - 1].startswith(note_prefix) else idx
                end = idx + 1
                replacement = [note, f'uvloop=={version} ; sys_platform != "win32"\n']

                if idx + 1 < len(lines) and lines[idx + 1].lstrip().startswith("# via uvicorn"):
                    end = idx + 2
                    replacement.append(lines[idx + 1])

                lines[start:end] = replacement
                sub_count = 1
                break

        if sub_count == 0:
            raise SystemExit(
                "uvloop dependency line not found in requirements.txt; "
                "ensure uvicorn[standard] remains declared in requirements.in"
            )

        path.write_text("".join(lines))
        PY
        git diff --exit-code requirements.txt

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black isort mypy

    - name: Run Black code formatter check
      run: |
        cd backend
        black --check . || true

    - name: Run isort import check
      run: |
        cd backend
        isort --check-only . || true

    - name: Run Flake8 linting
      run: |
        cd backend
        flake8 . --max-line-length=100 --extend-ignore=E203,W503 || true
