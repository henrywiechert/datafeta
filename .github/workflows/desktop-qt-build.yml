# Build the Qt (PySide6) desktop prototype for macOS, Windows, and Linux.
#
# Manual only, so it never interferes with the Electron workflow (desktop-build.yml).
# With "publish", artifacts + latest-qt-*.json are uploaded to the GitHub Release
# v<desktop/package.json version> (created if missing), which the Qt updater reads.

name: Desktop build (Qt prototype)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload artifacts to GitHub Release v<desktop/package.json version>"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-qt-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure GitHub release exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="$(python -c 'import json, pathlib; print(json.loads(pathlib.Path("desktop/package.json").read_text())["version"])')"
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.publish }}" != "true" ]]; then
            exit 0
          fi
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
              --title "${VERSION}" --notes ""
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
          - os: windows-latest
          # Oldest supported runner: the AppImage needs a glibc at least as new as the build host's.
          - os: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            desktop/qt/requirements.txt

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxkbfile1 libasound2 libfontconfig1 libdbus-1-3

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # uvloop is Unix-only; see desktop-build.yml.
          grep -v '^uvloop==' backend/requirements.txt > "${RUNNER_TEMP}/requirements-desktop.txt"
          python -m pip install -r "${RUNNER_TEMP}/requirements-desktop.txt"
          python -m pip install -r desktop/qt/requirements.txt

      - name: Build frontend → backend/static
        shell: bash
        run: bash desktop/scripts/build-frontend.sh

      - name: Build and package Qt shell
        shell: bash
        env:
          DATAFETA_PYTHON: python
          SKIP_FRONTEND: "1"
        run: bash desktop/qt/scripts/build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-qt-${{ matrix.os }}
          if-no-files-found: error
          path: desktop/qt/dist/*

      - name: Publish to GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ needs.prepare-release.outputs.tag }}" desktop/qt/dist/* --clobber --repo "${GITHUB_REPOSITORY}"
