<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="alternate icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <script>
      /*
       * Resolve the colour scheme before the first paint.
       *
       * MUI's CssVarsProvider sets this attribute itself, but only once React
       * commits — and html/body sit outside the provider, so without this the
       * page paints light and then snaps to dark on reload. MUI ships
       * InitColorSchemeScript for exactly this, but it is a React component
       * meant for server rendering and cannot run in a CRA static shell.
       *
       * Keys must match ThemeRoot's modeStorageKey / colorSchemeStorageKey.
       */
      (function () {
        try {
          var mode = localStorage.getItem('dataslicer.themeMode') || 'system';
          if (mode === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          /*
           * Which *scheme* a mode uses is a second choice: dark mode can be
           * served by more than one dark scheme (dark, dim). MUI stores that
           * per mode under `<colorSchemeStorageKey>-<mode>`, so read it rather
           * than assuming scheme === mode, or picking Dim would still flash
           * plain dark on every reload.
           */
          var scheme = localStorage.getItem('dataslicer.themeScheme-' + mode) || mode;
          document.documentElement.setAttribute('data-df-color-scheme', scheme);
        } catch (e) {
          /* private browsing, or no matchMedia: light is the default anyway */
        }
      })();
    </script>
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Data Slicer</title>
    <!-- Load Montserrat with optimized settings for Windows -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Keep Inter as a fallback option -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      The build step will place the bundled scripts into the <body> tag.

      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
